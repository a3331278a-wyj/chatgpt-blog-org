<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" rx="24" fill="#f8fafc"/>
  <text x="48" y="54" fill="#072849" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Correction Card Example</text>

  <rect x="48" y="90" width="420" height="270" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="72" y="136" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Your sentence</text>
  <text x="72" y="180" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="17">I very like study English.</text>
  <text x="72" y="230" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="15">Issue: word order / collocation</text>
  <text x="72" y="265" fill="#9a3412" font-family="Arial, Helvetica, sans-serif" font-size="15">Level: A2 speaking practice</text>

  <rect x="500" y="90" width="420" height="270" rx="20" fill="#f0f7ff" stroke="#7cc5fc" stroke-width="2"/>
  <text x="524" y="136" fill="#0158a1" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ChatGPT rewrite</text>
  <text x="524" y="180" fill="#0b3f6e" font-family="Arial, Helvetica, sans-serif" font-size="17">I really like studying English.</text>
  <text x="524" y="230" fill="#0158a1" font-family="Arial, Helvetica, sans-serif" font-size="15">Tip: like + V-ing</text>
  <text x="524" y="265" fill="#0158a1" font-family="Arial, Helvetica, sans-serif" font-size="15">Alt: I enjoy learning English.</text>
  <text x="524" y="300" fill="#0c8ce9" font-family="Arial, Helvetica, sans-serif" font-size="15">Ask for 2 more natural versions</text>
</svg>
